# ── Bluetooth ──────────────────────────────────────────────────────────────────
# Nordic UART Service (NUS) — see src/ble_service.c for the command protocol.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="BL-LED"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_NUS=y

# Use Zephyr's software link layer instead of Nordic's SoftDevice Controller.
#
# With the SDC, merely REFERENCING bt_enable() crashes this board at boot,
# before main() and before USB — reason 19, K_ERR_ARM_MEM_DATA_ACCESS. Note
# it is the reference, not the call: with --gc-sections, not calling
# bt_enable() lets the linker drop the whole stack INCLUDING its SYS_INIT
# entries, which is why "BT compiled in but not started" appeared to work.
#
# The SDC brings up MPSL at boot; the software controller does not, so this
# swaps out the entire suspect subsystem.
CONFIG_BT_CTLR=y
CONFIG_BT_LL_SW_SPLIT=y

# Nordic's CC310 crypto library fails to link against picolibc with this
# toolchain (undefined memmove / bad ARM-Thumb relocation). Nothing here needs
# it: no pairing, no encryption, no privacy — just an unauthenticated NUS
# link on a hobby LED controller.
CONFIG_HW_CC3XX=n
CONFIG_BT_CTLR_LE_ENC=n

# Entropy from the plain nRF RNG peripheral rather than CC310 — the CC3XX
# entropy driver needs nrfxlib headers that come with the crypto library
# disabled above.
CONFIG_ENTROPY_CC3XX=n
CONFIG_ENTROPY_NRF5_RNG=y

# NUS allocates its buffers from the system heap.
CONFIG_HEAP_MEM_POOL_SIZE=2048

# ── No USB, no console (headless production) ────────────────────────────────────
# The finished product runs sealed and headless — no terminal is ever attached.
# With USB CDC as the console, writing flash while no host drains the port hard-
# resets the board on EVERY settings save. An attached reader keeps the USB
# endpoint drained and masks it, which is why it looked like an intermittent
# regression: it only bit in the production configuration. Confirmed by A/B test
# (reset with no reader, never with `cat /dev/ttyACM0` running).
#
# USB is not needed at run time — UF2 flashing is handled by the bootloader,
# independent of the app — so bring up neither USB nor a console. Logging stays
# compiled (LOG_INF calls remain) but has no backend and goes nowhere; the
# onboard LED is the liveness/crash signal (see src/main.c). To get logs back
# for debugging, re-enable this block and call usb_enable() in main().
CONFIG_USB_DEVICE_STACK=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# ── GPIO (onboard LED, used as a liveness heartbeat) ──────────────────────────
CONFIG_GPIO=y

# ── Battery monitoring ─────────────────────────────────────────────────────────
# Cell voltage via SAADC through an external divider (see the overlay), exposed
# as the standard BLE Battery Service so any app reads it without a custom
# command.
#
# This is a GAUGE, not protection. It cannot disconnect the cell — nothing in
# the battery's current path is under firmware control — and it only runs while
# the firmware does. Use a hardware protection PCB for real over-discharge and
# short-circuit safety.
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y
CONFIG_BT_BAS=y

# ── LED ring ───────────────────────────────────────────────────────────────────
# Driven over I2S, NOT SPI: every SPI transfer on this board — down to a single
# byte, on both SPIM1 and SPIM3, with the ring disconnected — crashes the CPU
# with K_ERR_ARM_MEM_DATA_ACCESS. That fault is unexplained; I2S avoids it.
CONFIG_LED_STRIP=y

# The strip is driven by the IN-TREE fork of the WS2812 I2S driver
# (drivers/ws2812_i2s_runtime/), which makes the colour order runtime-switchable
# (GRB / RGB / GRBW / RGBW) and persists it — one image drives both a 3-channel
# WS2812 strip and a 4-channel SK6812-RGBW strip. It is compiled directly as app
# source (see CMakeLists.txt) and binds the "blled,ws2812-i2s-runtime" node, so
# the upstream ws2812-i2s driver is left OFF.
CONFIG_WS2812_STRIP_I2S=n

# Must be explicit: the ws2812 node references the I2S controller by phandle
# rather than sitting on an i2s bus, so no driver auto-"selects" I2S and the
# device would never get instantiated.
CONFIG_I2S=y
CONFIG_I2S_NRFX=y

# ── Persistent settings (pixel count) ──────────────────────────────────────────
# Stored in NVS on the "storage" partition via the settings subsystem.
#
# NOTE: storage_partition in the board DTS was originally placed at 0xF4000,
# directly on top of the Adafruit UF2 bootloader. NVS erases every page it
# owns, so enabling this would have wiped the bootloader on the first save and
# left the board flashable only over SWD. The partition now ends at 0xF4000.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Match the 16 KB partition exactly (4 x 4096-byte flash pages). The backend
# clamps this to whatever the partition holds, but the default of 8 would ask
# for 32 KB — twice the partition — so state it explicitly rather than relying
# on the clamp to keep NVS off the bootloader.
CONFIG_SETTINGS_NVS_SECTOR_COUNT=4

# Flash erase/write stalls the CPU and blocks the radio. This hands the timing
# to the BLE controller's ticker so a save cannot disrupt a connection event.
CONFIG_SOC_FLASH_NRF_RADIO_SYNC_TICKER=y

# ── Output format ──────────────────────────────────────────────────────────────
# Produces build/zephyr/zephyr.uf2 for drag-and-drop flashing onto the board.
CONFIG_BUILD_OUTPUT_UF2=y

# Use code_partition from DTS (starts at 0x1000, after the bootloader's MBR).
CONFIG_USE_DT_CODE_PARTITION=y

# ── Thread / stack sizes ───────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=2048

# ── Logging ────────────────────────────────────────────────────────────────────
# Minimal mode routes log output straight to printk, synchronously.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# NOTE: CONFIG_ARM_MPU=n was tried during bring-up and does NOT boot on this
# SoC. Leave the MPU at its default (enabled).

# ── Stack sizes: the root cause was a STACK OVERFLOW ─────────────────────────
#
# Both failures on this board — any SPI transfer, and bt_enable() — were the
# same bug. Proof came from toggling the MPU stack guard and watching the
# fault code change:
#
#   guards ON  -> K_ERR_ARM_MEM_DATA_ACCESS (19): the MPU trapped a write into
#                 the guard region, i.e. it caught the overflow cleanly.
#   guards OFF -> K_ERR_ARM_USAGE_ILLEGAL_EPSR (35): nothing caught it, the
#                 stack was corrupted, and a return jumped to garbage.
#
# That is a stack overflow, and HW_STACK_PROTECTION was reporting it correctly
# — it must stay ON. It is a diagnosis, not the disease.
#
# NOT main's stack: MAIN_STACK_SIZE=8192 was tried against the SPI fault and
# changed nothing. Both failing paths do their work in INTERRUPT context, and
# ISR_STACK_SIZE defaults to only 2048.
CONFIG_HW_STACK_PROTECTION=y
CONFIG_ISR_STACK_SIZE=4096
